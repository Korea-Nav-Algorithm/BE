services:
  navigation-edge:
    image: ${NAV_EDGE_IMAGE:-navigation-edge:local}
    build:
      context: ..
      dockerfile: navigation-edge/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../data:/data
    environment:
      NAV_ENGINE_BASE_URL: ${NAV_ENGINE_BASE_URL:?Set Engine LAN/VPN URL}
      NAV_ENGINE_READ_TIMEOUT_SECONDS: ${NAV_ENGINE_READ_TIMEOUT_SECONDS:-9}
      PLACE_SEARCH_PROVIDER: ${PLACE_SEARCH_PROVIDER:-json}
      PLACE_SEARCH_FILE: ${PLACE_SEARCH_FILE:-/data/dev-places.json}
      NAVER_PLACE_API_URL: ${NAVER_PLACE_API_URL:-https://openapi.naver.com/v1/search/local.json}
      NAVER_SEARCH_CLIENT_ID: ${NAVER_SEARCH_CLIENT_ID:-}
      NAVER_SEARCH_CLIENT_SECRET: ${NAVER_SEARCH_CLIENT_SECRET:-}
      TRIP_DB_PATH: ${TRIP_DB_PATH:-/data/navigation.db}
      TRIP_ADMIN_KEY: ${TRIP_ADMIN_KEY:-}
    restart: unless-stopped
