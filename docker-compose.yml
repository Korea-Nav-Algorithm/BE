services:
  navigation-engine:
    build:
      context: .
      dockerfile: navigation-engine/Dockerfile
    ports:
      - "127.0.0.1:${ENGINE_HOST_PORT:-8090}:8090"
    volumes:
      - ./data:/data:ro
    environment:
      GRAPH_SOURCE: ${GRAPH_SOURCE:-json}
      GRAPH_FILE: ${GRAPH_FILE:-/data/dev-graph.json}
      OSM_PBF_FILE: ${OSM_PBF_FILE:-/data/osm/gyeonggi-latest.osm.pbf}
      OSM_BBOX: ${OSM_BBOX:-}
      TRAFFIC_PROVIDER: ${TRAFFIC_PROVIDER:-json}
      TRAFFIC_FILE: ${TRAFFIC_FILE:-/data/dev-traffic.json}
      TRAFFIC_MAPPING_FILE: ${TRAFFIC_MAPPING_FILE:-/data/traffic-mapping.json}
      TRAFFIC_LINK_GEOMETRY_FILE: ${TRAFFIC_LINK_GEOMETRY_FILE:-}
      GG_TRAFFIC_ROUTE_IDS: ${GG_TRAFFIC_ROUTE_IDS:-}
      GG_TRAFFIC_API_KEY: ${GG_TRAFFIC_API_KEY:-}
      GG_TRAFFIC_URL: ${GG_TRAFFIC_URL:-https://openapigits.gg.go.kr/api/rest/getRoadTrafficInfoList}
      MAX_PROPAGATION_DISTANCE_METERS: ${MAX_PROPAGATION_DISTANCE_METERS:-3000}
      ETA_UNOBSERVED_SPEED_FACTOR: ${ETA_UNOBSERVED_SPEED_FACTOR:-0.75}
      NAVIGATION_ALGORITHM_VERSION: ${NAVIGATION_ALGORITHM_VERSION:-navigation-traffic-20261005-01}
    restart: unless-stopped
  navigation-edge:
    build:
      context: .
      dockerfile: navigation-edge/Dockerfile
    depends_on:
      navigation-engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EDGE_HOST_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    environment:
      NAV_ENGINE_BASE_URL: ${NAV_ENGINE_BASE_URL:-http://navigation-engine:8090}
      NAV_ENGINE_READ_TIMEOUT_SECONDS: ${NAV_ENGINE_READ_TIMEOUT_SECONDS:-9}
      PLACE_SEARCH_PROVIDER: ${PLACE_SEARCH_PROVIDER:-json}
      PLACE_SEARCH_FILE: ${PLACE_SEARCH_FILE:-/data/dev-places.json}
      NAVER_PLACE_API_URL: ${NAVER_PLACE_API_URL:-https://openapi.naver.com/v1/search/local.json}
      NAVER_SEARCH_CLIENT_ID: ${NAVER_SEARCH_CLIENT_ID:-}
      NAVER_SEARCH_CLIENT_SECRET: ${NAVER_SEARCH_CLIENT_SECRET:-}
      TRIP_DB_PATH: ${TRIP_DB_PATH:-/data/navigation.db}
      TRIP_ADMIN_KEY: ${TRIP_ADMIN_KEY:-}
    restart: unless-stopped
