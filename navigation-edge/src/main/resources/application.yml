server:
  port: 8080
spring:
  datasource:
    url: jdbc:sqlite:${TRIP_DB_PATH:data/navigation.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      connection-init-sql: PRAGMA busy_timeout=5000
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
navigation:
  engine-base-url: ${NAV_ENGINE_BASE_URL:http://localhost:8090}
  engine-read-timeout-seconds: ${NAV_ENGINE_READ_TIMEOUT_SECONDS:9}
  trip-admin-key: ${TRIP_ADMIN_KEY:}
places:
  provider: ${PLACE_SEARCH_PROVIDER:json}
  file: ${PLACE_SEARCH_FILE:data/dev-places.json}
  naver-url: ${NAVER_PLACE_API_URL:https://openapi.naver.com/v1/search/local.json}
  naver-client-id: ${NAVER_SEARCH_CLIENT_ID:}
  naver-client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}
